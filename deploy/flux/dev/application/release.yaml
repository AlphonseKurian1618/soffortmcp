apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: soffortbackend
  namespace: flux-system
  annotations:
    clusterconfig.azure.com/use-managed-source: "true"
spec:
  # The chart runs in soffortbackend, while reconciliation uses Azure managed
  # Flux's pre-existing deployment identity instead of adding runtime RBAC.
  targetNamespace: soffortbackend
  # The release workflow changes this to false only after publishing and
  # scanning a real immutable image digest.
  suspend: false
  interval: 5m
  timeout: 10m
  releaseName: soffortbackend
  chart:
    spec:
      chart: ./deploy/charts/soffortbackend
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: soffortbackend-dev
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    image:
      repository: ${ACR_LOGIN_SERVER}/soffortbackend
      digest: sha256:d6c1f452839974e1c47d8b8e0d8f0410bdef2dc1503e9a5443175a672ef3cfc0
    identity:
      issuer: ${ENTRA_ISSUER}
      jwksUrl: ${ENTRA_JWKS_URL}
      tenantId: ${ENTRA_TENANT_ID}
      apiAudience: ${ENTRA_API_AUDIENCE}
      vscodeClientId: ${ENTRA_VSCODE_CLIENT_ID}
      iosClientId: ${ENTRA_IOS_CLIENT_ID}
    approval:
      cosmosEndpoint: ${COSMOS_ENDPOINT}
      workloadClientId: ${AZURE_WORKLOAD_CLIENT_ID}
      keyVaultUrl: ${KEY_VAULT_URL}
      apnsSecretVersion: ${APNS_PRIVATE_KEY_SECRET_VERSION}
      apnsKeyId: ${APNS_KEY_ID}
