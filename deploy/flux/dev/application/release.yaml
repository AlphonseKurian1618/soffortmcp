apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: soffortbackend
  namespace: flux-system
  annotations:
    clusterconfig.azure.com/use-managed-source: "true"
spec:
  # The chart runs in soffortbackend, while reconciliation uses Azure managed
  # Flux's pre-existing deployment identity instead of adding runtime RBAC.
  targetNamespace: soffortbackend
  # The release workflow changes this to false only after publishing and
  # scanning a real immutable image digest.
  suspend: false
  interval: 5m
  timeout: 10m
  releaseName: soffortbackend
  chart:
    spec:
      chart: ./deploy/charts/soffortbackend
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: soffortbackend-dev
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    image:
      repository: ${ACR_LOGIN_SERVER}/soffortbackend
      digest: sha256:e6ee0ef7597cf595cd2d4df7ad3322070fa1c0f0466dd9e546d9cd880acc5af6
    identity:
      issuer: ${ENTRA_ISSUER}
      jwksUrl: ${ENTRA_JWKS_URL}
      tenantId: ${ENTRA_TENANT_ID}
      apiAudience: ${ENTRA_API_AUDIENCE}
      vscodeClientId: ${ENTRA_VSCODE_CLIENT_ID}
