apiVersion: v1
kind: Namespace
metadata:
  name: soffortbackend
  labels:
    app.kubernetes.io/part-of: soffortbackend
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# The managed Helm controller impersonates this deployment-only identity. It is
# separate from soffortbackend's runtime ServiceAccount and has no mounted token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: soffortbackend
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-helm-installer
  namespace: soffortbackend
rules:
  - apiGroups: [""]
    resources: ["secrets", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares", "tlsoptions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-helm-installer
  namespace: soffortbackend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-helm-installer
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: soffortbackend
