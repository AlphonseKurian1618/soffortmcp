apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  # Azure managed Flux disables cross-namespace source references. Keep the
  # source and release together in its existing deployment namespace.
  namespace: flux-system
spec:
  interval: 24h
  timeout: 60s
  url: https://traefik.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 24h
  timeout: 60s
  url: https://charts.jetstack.io
