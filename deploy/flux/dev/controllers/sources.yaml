apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  # Azure's managed Flux extension disables cross-namespace references. Keep
  # each chart source beside the HelmRelease that is allowed to consume it.
  namespace: traefik
spec:
  interval: 24h
  timeout: 60s
  url: https://traefik.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 24h
  timeout: 60s
  url: https://charts.jetstack.io
