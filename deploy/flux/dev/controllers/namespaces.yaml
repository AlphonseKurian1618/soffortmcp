apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    app.kubernetes.io/part-of: soffortbackend
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: soffortbackend
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Azure's managed Flux extension defaults Helm impersonation to a service
# account named flux-applier in the release namespace. These accounts are never
# mounted into workload pods; the Helm controller alone impersonates them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: traefik
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: cert-manager
automountServiceAccountToken: false
---
# Helm must manage release secrets and only the resource types rendered by the
# pinned chart inside each dedicated namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-helm-installer
  namespace: traefik
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-helm-installer
  namespace: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-helm-installer
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-helm-installer
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames:
      - cert-manager-startupapicheck:create-cert
      - cert-manager-webhook:dynamic-serving
    verbs: ["escalate", "bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-helm-installer
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-helm-installer
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: cert-manager
---
# cert-manager pins its leader-election Roles in kube-system. This binding can
# manage only namespaced RBAC and cannot read workloads, Secrets, or ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: soffort-cert-manager-flux-installer
  namespace: kube-system
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames:
      - cert-manager-cainjector:leaderelection
      - cert-manager:leaderelection
    verbs: ["escalate", "bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: soffort-cert-manager-flux-installer
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: soffort-cert-manager-flux-installer
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: cert-manager
---
# The pinned platform charts also declare CRDs, webhook configuration, and
# cluster-level discovery/RBAC objects. Escalation and binding are restricted
# to the exact ClusterRole names rendered by those chart versions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: soffort-platform-flux-installer
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - cert-manager-cainjector
      - cert-manager-cluster-view
      - cert-manager-controller-approve:cert-manager-io
      - cert-manager-controller-certificates
      - cert-manager-controller-certificatesigningrequests
      - cert-manager-controller-challenges
      - cert-manager-controller-clusterissuers
      - cert-manager-controller-ingress-shim
      - cert-manager-controller-issuers
      - cert-manager-controller-orders
      - cert-manager-edit
      - cert-manager-view
      - cert-manager-webhook:subjectaccessreviews
      - traefik-traefik
    verbs: ["escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - cert-manager-cainjector
      - cert-manager-controller-approve:cert-manager-io
      - cert-manager-controller-certificates
      - cert-manager-controller-certificatesigningrequests
      - cert-manager-controller-challenges
      - cert-manager-controller-clusterissuers
      - cert-manager-controller-ingress-shim
      - cert-manager-controller-issuers
      - cert-manager-controller-orders
      - cert-manager-webhook:subjectaccessreviews
      - traefik-traefik
    verbs: ["bind"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: soffort-platform-flux-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: soffort-platform-flux-installer
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: traefik
  - kind: ServiceAccount
    name: flux-applier
    namespace: cert-manager
