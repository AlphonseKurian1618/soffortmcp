apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-standard
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 1m
  timeout: 5m
  wait: true
  prune: true
  path: ./config/crd/standard
  sourceRef:
    kind: GitRepository
    name: gateway-api-standard

