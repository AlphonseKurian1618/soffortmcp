apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: soffortbackend
  labels:
    {{- include "soffortbackend.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.httpListenerPort }}
      hostname: {{ .Values.gateway.hostname }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.httpsListenerPort }}
      hostname: {{ .Values.gateway.hostname }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: soffortbackend-redirect
  labels:
    {{- include "soffortbackend.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: soffortbackend
      sectionName: http
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            # Listener ports are internal; clients must receive the public TLS port.
            port: 443
            statusCode: 308
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: soffortbackend
  labels:
    {{- include "soffortbackend.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: soffortbackend
      sectionName: https
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/v1
        - path:
            type: PathPrefix
            value: /v1
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: soffortbackend-body-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: soffortbackend-rate-limit
      backendRefs:
        - name: {{ include "soffortbackend.fullname" . }}
          port: {{ .Values.service.port }}
