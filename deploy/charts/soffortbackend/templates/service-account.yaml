apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "soffortbackend.fullname" . }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.approval.workloadClientId | quote }}
    # Do not set azure.workload.identity/tenant-id to the customer External ID
    # tenant. The AKS webhook supplies the subscription tenant that owns this
    # managed identity; Entra customer-token validation remains separate.
  labels:
    {{- include "soffortbackend.labels" . | nindent 4 }}
automountServiceAccountToken: false
