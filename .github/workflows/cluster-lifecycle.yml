name: cluster lifecycle

on:
  workflow_dispatch:
    inputs:
      action:
        description: Desired cluster state
        required: true
        type: choice
        options: [start, stop]
  schedule:
    # GitHub schedules are UTC. Running hourly and evaluating Los Angeles local
    # time makes the stop policy correct across daylight-saving transitions.
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cluster-lifecycle-development
  cancel-in-progress: false

jobs:
  lifecycle:
    name: start or cost-protect the development cluster
    # Scheduled runs begin as soon as this file reaches main. GitHub evaluates
    # this guard before entering the environment, so the non-secret lifecycle
    # client ID is mirrored at repository scope after AKS creates the identity.
    if: vars.AZURE_LIFECYCLE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Sign in with the cluster-only lifecycle identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_LIFECYCLE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply requested or scheduled state
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
          EVENT_NAME: ${{ github.event_name }}
          TZ: America/Los_Angeles
        run: |
          action="${REQUESTED_ACTION}"
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            hour="$(date +%H)"
            if (( 10#${hour} >= 19 || 10#${hour} < 7 )); then action=stop; else exit 0; fi
          fi
          state="$(az aks show -g rg-soffortbackend-dev-wus2 -n aks-soffortbackend-dev-wus2 --query powerState.code -o tsv)"
          if [[ "${action}" == "start" && "${state}" != "Running" ]]; then
            az aks start -g rg-soffortbackend-dev-wus2 -n aks-soffortbackend-dev-wus2 --no-wait
          elif [[ "${action}" == "stop" && "${state}" == "Running" ]]; then
            az aks stop -g rg-soffortbackend-dev-wus2 -n aks-soffortbackend-dev-wus2 --no-wait
          fi
