name: release

on:
  push:
    branches: [main]
    paths:
      - src/**
      - Dockerfile
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-development
  cancel-in-progress: false

jobs:
  publish:
    name: publish immutable image
    # Job conditions are evaluated before GitHub enters the development
    # environment. These three non-secret existence gates therefore also live
    # at repository scope; environment-scoped values remain the runtime source.
    if: vars.ACR_NAME != '' && vars.ACR_LOGIN_SERVER != '' && vars.AZURE_RELEASE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign in to Azure using the release identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_RELEASE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Docker in to ACR without a registry password
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build, attest, and publish both architectures
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/soffortbackend:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the exact published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/soffortbackend@${{ steps.image.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Update only the GitOps digest
        run: python scripts/update-release.py --digest "${{ steps.image.outputs.digest }}"
      - name: Open a reviewed deployment pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: deploy/development-${{ github.sha }}
          delete-branch: true
          commit-message: "deploy(dev): ${{ steps.image.outputs.digest }}"
          title: "Deploy development image ${{ github.sha }}"
          body: |
            Publishes the tested multi-architecture image by immutable digest.
            Merge causes Flux to reconcile; revert this commit to roll back.
          add-paths: deploy/flux/dev/application/release.yaml
